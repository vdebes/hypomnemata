name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0   # full history: SonarQube needs blame to spot new code
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      # No --no-build here: it would also forbid building hypomnemata itself
      # (uv has no "build only this package" option). Dependencies are wheels.
      - run: uv sync --locked
      - name: Lint (ruff)
        run: uv run --no-sync --no-build ruff check .
      - name: Format (ruff)
        run: uv run --no-sync --no-build ruff format --check .
      - name: Types (mypy)
        run: uv run --no-sync --no-build mypy
      - name: Unit tests (pytest)
        run: uv run --no-sync --no-build pytest --cov --cov-report=term-missing --cov-report=xml
      # Code quality and coverage, sent to SonarQube Cloud (needs the
      # SONAR_TOKEN secret; automatic analysis must be off in SonarQube).
      - name: SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
